<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scribe</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6e6e73;--line:#d2d2d7;--acc:#0a66ff;--rec:#e5232e}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#f2f2f7;--mut:#98989d;--line:#3a3a3c;--acc:#4c8dff}}
body{font:15px/1.5 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:820px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;margin:0 0 16px}
button,select,input,textarea{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 14px}
button{cursor:pointer}button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.mut{color:var(--mut);font-size:13px}
textarea{width:100%;box-sizing:border-box;min-height:320px;line-height:1.6}
#drop{border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--mut)}
#drop.over{border-color:var(--acc)}
details{margin-top:20px}
</style></head><body>
<h1>Scribe <span class="mut">— local transcription, nothing leaves this Mac</span></h1>
<div class="row">
  <button id="rec" class="primary">● Record</button><span id="timer" class="mut"></span>
  <select id="model" title="Bigger = more accurate, slower">
    <option value="large-v3-turbo">large-v3-turbo (best)</option><option value="small">small (fast)</option>
    <option value="base">base (fastest)</option><option value="large-v3">large-v3 (slowest)</option></select>
  <input id="lang" placeholder="language (auto)" size="14" title="e.g. en">
</div>
<div id="drop">…or drop / <label style="color:var(--acc);cursor:pointer">choose<input id="file" type="file" accept="audio/*,video/*" hidden></label> an audio file</div>
<div class="row mut">
  <label><input type="checkbox" id="fillers" checked> remove um/uh</label>
  <label><input type="checkbox" id="stamps"> timestamps</label>
  <label>AI polish (Ollama model): <input id="llm" placeholder="e.g. llama3.1:8b" size="16"></label>
</div>
<button id="recover" hidden style="margin:8px 0"></button>
<div id="model-status" class="mut"></div>
<div id="status" class="mut"></div>
<textarea id="out" placeholder="Transcript appears here (editable)"></textarea>
<div class="row"><button id="copy">Copy</button><button id="showraw">Show raw</button><span id="saved" class="mut"></span></div>
<details><summary>Corrections dictionary</summary>
  <p class="mut">One per line: <code>wrong =&gt; right</code>. Applied to every transcript; the right-hand spellings are also fed to Whisper as hints.</p>
  <textarea id="corr" style="min-height:160px"></textarea><div class="row"><button id="savecorr">Save</button></div></details>
<script>
const $=id=>document.getElementById(id);let rec,t0,timerT,last={};
let ready=false,poll;
async function watchModel(){
  clearInterval(poll);ready=false;const m=$('model').value,ms=$('model-status');
  $('rec').disabled=true;
  await fetch('/api/model/'+m,{method:'POST'});
  const check=async()=>{const j=await (await fetch('/api/model/'+m)).json();
    if($('model').value!==m)return;
    if(j.status==='ready'){clearInterval(poll);ready=true;$('rec').disabled=false;ms.textContent='Model ready.'}
    else if(j.status==='error'){clearInterval(poll);$('rec').disabled=false;ms.textContent='Model failed to load: '+j.error+' (check your internet connection; see the terminal)'}
    else ms.textContent='Downloading/loading model… first run only (progress is in the terminal). Try the "small" model for a quicker start.'};
  poll=setInterval(check,1500);check();
}
$('model').onchange=watchModel;watchModel();
const status=s=>$('status').textContent=s;
async function send(blob,name){
  status('Transcribing… (first run downloads the model)');
  const fd=new FormData();fd.append('audio',blob,name);fd.append('model',$('model').value);
  fd.append('language',$('lang').value.trim());fd.append('fillers',$('fillers').checked?1:0);
  fd.append('timestamps',$('stamps').checked?1:0);fd.append('llm',$('llm').value.trim());
  try{const r=await fetch('/api/transcribe',{method:'POST',body:fd});if(!r.ok){let m;try{m=(await r.json()).error}catch{m=r.statusText}throw new Error(m)}
    last=await r.json();$('out').value=last.text;$('saved').textContent='Saved '+last.saved;status('Done.');}
  catch(e){status('Error: '+e.message)}
}
// ---- live recording: chunks stream to the server as they're captured; text appears as it's transcribed ----
let sid=null,q=[],seq=0,sending=false,stopping=false,finishing=false,pollT=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const opts=()=>({model:$('model').value,language:$('lang').value.trim(),fillers:$('fillers').checked,
  timestamps:$('stamps').checked,llm:$('llm').value.trim()});
async function pump(){
  if(sending)return;sending=true;
  while(q.length){
    try{const r=await fetch(`/api/session/${sid}/chunk?seq=${q[0].seq}`,{method:'POST',body:q[0].blob});
      if(!r.ok)throw new Error(r.status);q.shift()}
    catch(e){status('Connection to the app interrupted; retrying (audio is kept)…');await sleep(2000)}
  }
  sending=false;
  if(stopping&&!finishing)finish();
}
async function finish(){
  finishing=true;status('Finishing transcription…');
  while(true){try{const r=await fetch(`/api/session/${sid}/finish`,{method:'POST'});if(r.ok)break}catch(e){}await sleep(2000)}
  watch(sid);
}
function watch(id){
  clearInterval(pollT);$('rec').disabled=true;
  const tick=async()=>{
    try{const j=await (await fetch('/api/session/'+id)).json();
      if(j.error&&j.status!=='done')$('status').textContent='Warning: '+j.error;
      if(j.status==='done'){clearInterval(pollT);last=j;$('out').value=j.text;$('saved').textContent='Saved '+j.saved;
        status('Done.');$('rec').disabled=false;sid=null;return}
      $('out').value=j.text||'';$('out').scrollTop=1e9;
      if(!j.error)status((j.status==='finalizing'?'Finishing… ':'Recording — live transcript. ')+
        `${(j.transcribed_seconds/60).toFixed(1)} min transcribed`)
    }catch(e){}
  };
  pollT=setInterval(tick,2000);tick();
}
$('rec').onclick=async()=>{
  if(rec&&rec.state==='recording'){rec.stop();return}
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});
    const mt=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
    const ext=mt.includes('mp4')?'m4a':'webm';
    sid=(await (await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({...opts(),ext})})).json()).id;
    q=[];seq=0;stopping=false;finishing=false;last={};$('out').value='';$('saved').textContent='';
    rec=new MediaRecorder(s,mt?{mimeType:mt}:undefined);
    rec.ondataavailable=e=>{if(e.data.size){q.push({seq:seq++,blob:e.data});pump()}};
    s.getAudioTracks().forEach(t=>t.onended=()=>{if(rec.state==='recording'){status('Microphone was interrupted; saving what was captured…');rec.stop()}});
    rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());clearInterval(timerT);$('timer').textContent='';
      $('rec').textContent='● Record';$('rec').className='primary';stopping=true;
      if(!seq){status('Microphone stream stopped before any audio was captured. Close other apps using the mic, check System Settings > Privacy > Microphone, or try Chrome.');return}
      if(!sending)finish()};
    rec.start(1000);t0=Date.now();$('rec').textContent='■ Stop';$('rec').className='rec';
    watch(sid);$('rec').disabled=false;
    timerT=setInterval(()=>{const t=(Date.now()-t0)/1000|0;$('timer').textContent=`${t/60|0}:${String(t%60).padStart(2,'0')}`},500);
  }catch(e){status('Microphone unavailable: '+e.message)}
};
window.onbeforeunload=e=>{if(rec&&rec.state==='recording'){e.preventDefault();return''}};
fetch('/api/sessions/unfinished').then(r=>r.json()).then(l=>{
  if(!l.length)return;const u=l[l.length-1],b=$('recover');
  b.hidden=false;b.textContent=`Recover unfinished recording from ${new Date(u.created*1000).toLocaleString()} (${(u.bytes/1e6).toFixed(1)} MB)`;
  b.onclick=async()=>{b.hidden=true;sid=u.id;await fetch(`/api/session/${u.id}/finish`,{method:'POST'});watch(u.id)}});
$('file').onchange=e=>e.target.files[0]&&send(e.target.files[0],e.target.files[0].name);
const d=$('drop');d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
d.ondrop=e=>{e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];f&&send(f,f.name)};
$('copy').onclick=()=>navigator.clipboard.writeText($('out').value).then(()=>status('Copied.'));
$('showraw').onclick=()=>{const raw=$('showraw').dataset.on!=='1';$('showraw').dataset.on=raw?'1':'';
  $('showraw').textContent=raw?'Show corrected':'Show raw';$('out').value=raw?last.raw||'':last.text||''};
fetch('/api/corrections').then(r=>r.json()).then(j=>$('corr').value=j.text);
$('savecorr').onclick=()=>fetch('/api/corrections',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('corr').value})}).then(()=>status('Dictionary saved.'));
</script></body></html>
